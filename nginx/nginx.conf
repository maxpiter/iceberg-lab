# По образцу examples/access-control-advanced/nginx.conf.
# Trino с OAuth2 требует HTTPS: nginx снимает TLS и сообщает Trino исходную схему и адрес.
# Порт 8443 одинаковый внутри и снаружи, чтобы адрес возврата после входа совпал с браузером.
events {}

http {
    server {
        listen 8443 ssl;
        http2  on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        # DNS Docker: адрес trino ищется заново (не чаще раза в 10 с), а не один раз при старте nginx.
        # Иначе после перезапуска Trino с новым IP nginx отвечает 502 (проверено 03.10.2026).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $trino_upstream http://trino:8080;

        location / {
            proxy_pass $trino_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}
