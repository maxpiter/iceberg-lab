# По образцу examples/access-control-advanced/trino/config.properties
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://trino:8080

# Вход пользователей через Keycloak (OAuth2). Trino с OAuth2 работает только за HTTPS,
# его даёт nginx на localhost:8443.
http-server.authentication.type=oauth2
http-server.authentication.oauth2.issuer=${ENV:OIDC_ISSUER}
http-server.authentication.oauth2.oidc.discovery=false
# auth-url открывает браузер пользователя (снаружи docker), остальные адреса - изнутри
http-server.authentication.oauth2.auth-url=http://localhost:30080/realms/iceberg/protocol/openid-connect/auth
http-server.authentication.oauth2.jwks-url=http://keycloak:8080/realms/iceberg/protocol/openid-connect/certs
http-server.authentication.oauth2.token-url=http://keycloak:8080/realms/iceberg/protocol/openid-connect/token
http-server.authentication.oauth2.client-id=trino
http-server.authentication.oauth2.client-secret=e5sx35mYVkG3p3dAu1IYYgfCm0wBjbIK
http-server.authentication.oauth2.scopes=trino
http-server.process-forwarded=true
web-ui.authentication.type=oauth2
web-ui.enabled=true

# генерируется при первом запуске (init/gen-secrets.sh)
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
