# Каталог Iceberg в Lakekeeper (warehouse demo)
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=demo
# ключи к S3 Trino получает от каталога на каждую таблицу (vended credentials)
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://rustfs.localhost:9100
s3.region=us-east-1
s3.path-style-access=true
# в каталог Trino ходит одной технической учёткой trino,
# права конкретного пользователя проверяет OPA (access-control.properties)
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=trino:e5sx35mYVkG3p3dAu1IYYgfCm0wBjbIK
iceberg.rest-catalog.oauth2.scope=lakekeeper offline_access
iceberg.rest-catalog.oauth2.server-uri=http://keycloak:8080/realms/iceberg/protocol/openid-connect/token
# Учебный стенд: обслуживание таблиц сразу видно, без недельной выдержки.
# В рабочей системе оставьте значения по умолчанию (7d).
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
